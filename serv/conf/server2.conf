server {
	listen 8080;
	server_name localhost;

	client_max_body 1000000;

	error_page 400 /errors/400.html;
	error_page 403 /errors/403.html;
	error_page 404 /errors/404.html;
	error_page 405 /errors/405.html;
	error_page 413 /errors/413.html;
	error_page 500 /errors/500.html;

	location / {
		root ./www;
		limit_except GET;
		index index.html;
		autoindex off;
	}

	location /files {
		root ./www/files;
		limit_except GET;
		autoindex on;
	}

	location /upload {
		root ./www/upload;
		limit_except GET POST;
		uploads ./www/upload/store;
		client_max_body 500000;
	}

	location /delete {
		root ./www/upload/store;
		limit_except DELETE;
	}

	location /cgi-bin {
		root ./cgi-bin;
		limit_except GET POST;
		cgi .py /usr/bin/python3;
		cgi .php /usr/bin/php-cgi;
	}
}

