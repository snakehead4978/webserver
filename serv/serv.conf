server {
	listen        3000;
	server_name   one.example.com yoyo.com;





	location / {

		client_max_body       10000000;
	}

	error_page  404  /404.html;

	location  /404.html {
		root  /spool/www;
	}

	location /download/ {

		root         /spool/www;
	}


}



server {
    listen 9743;
    server_name localhost;
    root ./assets/default_website;
    autoindex on;
    error_page 404 error_pages/404.jpg;
    cgi .py /usr/bin/python3;
    location /cgi-demo {
        index hello.py;
    }
    location /redirect-demo {
        return 301 "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
    }
}

server {
    listen 8070;
    server_name localhost;

    root /var/www/webserv_test; 
    index index.html;


    location /some\name.html {
        root /var/www/webserv_test/error;
    }

    error_page 404 e.a;

    location / {
    
        limit_except GET POST;
    
    
    
        
    }


    location /files/ {
        autoindex on; 
    
    }


    location /old-path {
        return 301 /subdir/another.html; 
    }


    location /upload_test {
        client_max_body 100000;
        uploads uploads_dir/;
    }


    location /forbidden/ {
        return 403;
    }
}

server {
    listen 9866;
    server_name example.com;
    root /var/www/example;
}

server {
    listen 8082;
    server_name test.com;
    root /var/www/test;
}

server {
    listen 8083;
    server_name something.com;
    root /var/www/api;
}

server {
    listen 8251;
    server_name hello.com world.com;
    root /var/www/hello_world;
    location / {
        limit_except GET;
    }
}